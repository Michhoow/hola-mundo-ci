name: Alerta

on:
  push:
    branches:
      - main

jobs:
  build-y-notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar notificación a ntfy.sh
        if: always()
        run: |
          curl -s \
            -H "Title: Hola mundo a netfy Michael Martinez 2024 2440" \
            -H "Tags: rocket" \
            -d "Hola mundo a netfy Michael Martinez 2024 2440" \
            https://ntfy.sh/devops-itla
